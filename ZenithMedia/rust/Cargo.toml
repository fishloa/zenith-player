[package]
name = "zenith-media"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Thin C ABI over transmux streaming TS demux and oxideav-mp2 for the zenith-tv Apple player"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
transmux = "=0.33.0"
broadcast-common = "=14.0.0"
buffering-runtime = "=0.5.0"
broadcast-client = "=0.8.0"
oxideav-mp2 = "=0.0.10"
http = "1"
url = "2"

[profile.release]
panic = "abort"
lto = "thin"

[workspace]

