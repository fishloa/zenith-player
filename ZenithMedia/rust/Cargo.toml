[package]
name = "zenith-media"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Thin C ABI over transmux streaming TS demux and oxideav-mp2 for the zenith-tv Apple player"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
transmux = { git = "https://github.com/fishloa/rust-broadcast", rev = "b4f351926dce8eb988bfaf89c7a31ed4cf66e577" }
broadcast-common = { git = "https://github.com/fishloa/rust-broadcast", rev = "b4f351926dce8eb988bfaf89c7a31ed4cf66e577" }
buffering-runtime = { git = "https://github.com/fishloa/rust-broadcast", rev = "b4f351926dce8eb988bfaf89c7a31ed4cf66e577" }
broadcast-client = { git = "https://github.com/fishloa/rust-broadcast", rev = "b4f351926dce8eb988bfaf89c7a31ed4cf66e577" }
oxideav-mp2 = "=0.0.10"

[profile.release]
panic = "abort"
lto = "thin"

[workspace]
